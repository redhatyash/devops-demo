apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-app
  namespace: argocd
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  source:
    repoURL: https://github.com/redhatyash/devops-demo
    targetRevision: HEAD
    path: helm/my-app
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
